name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q blockblox-revival-local.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build engine
        working-directory: blockblox-revival-main/engine
        run: |
          cargo ndk -t arm64-v8a -o ../launchers/android-libreblox/app/src/main/jniLibs build --release -p revival-client
          LIBCPP=$(find "$ANDROID_NDK_HOME" -name "libc++_shared.so" -path "*aarch64-linux-android*" | head -n 1)
          if [ -n "$LIBCPP" ]; then cp -f "$LIBCPP" ../launchers/android-libreblox/app/src/main/jniLibs/arm64-v8a/; fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: blockblox-revival-main/launchers/android-libreblox
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: blockblox-revival-main/launchers/android-libreblox/app/build/outputs/apk/debug/*.apk
